# Publishes the app to GitHub Pages on every push to the default branch, once the
# puzzle-layer self-check has passed. There is no build step: the deploy job
# copies the app's files into _site and uploads that. Keep the list of them in
# step with ASSETS in sw.js.
name: Test and deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time. A queued run waits rather than being cancelled, so the
# last push to land is the one that ends up live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      # No dependencies to install: the suite is plain Node and runs the whole
      # puzzle layer.
      - run: node tests/verify.mjs

  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Collect the app
        run: |
          mkdir _site
          cp -r index.html manifest.webmanifest sw.js css js art icons _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
